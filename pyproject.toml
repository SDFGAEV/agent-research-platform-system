[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "noetrium"
version = "0.44.0"
description = "Reproducible Research Infrastructure for AI Agents"
readme = "README.md"
keywords = ["ai-agents", "agent-research", "research-infrastructure", "reproducibility", "experiment-management", "multi-agent-systems", "agent-evaluation", "ai-infrastructure", "evidence", "scientific-computing"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/Xalzeroph/noetrium"
Repository = "https://github.com/Xalzeroph/noetrium"
Documentation = "https://github.com/Xalzeroph/Noetrium/tree/main/docs"
Examples = "https://github.com/Xalzeroph/Noetrium/tree/main/examples"
Discussions = "https://github.com/Xalzeroph/noetrium/discussions"
Security = "https://github.com/Xalzeroph/noetrium/security/policy"
Contributing = "https://github.com/Xalzeroph/Noetrium/blob/main/CONTRIBUTING.md"
Citation = "https://github.com/Xalzeroph/Noetrium/blob/main/CITATION.cff"
Issues = "https://github.com/Xalzeroph/noetrium/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
release = ["build>=1.2,<2", "twine>=5,<7"]

[project.scripts]
noetrium = "noetrium_platform.product.operator.composition.research:main"
noetrium-forensics = "noetrium_platform.product.operator.composition.cli:main"
noetrium-architecture-gate = "noetrium_platform.foundation.governance.architecture.gate:main"
noetrium-manage = "noetrium_platform.product.operator.maintenance.runtime.management_cli:main"
noetrium-algorithm = "noetrium_platform.foundation.governance.algorithm.cli:main"
noetrium-concurrency = "noetrium_platform.foundation.governance.concurrency.cli:main"
noetrium-performance = "noetrium_platform.foundation.governance.performance.cli:main"
noetrium-repository-boundary = "noetrium_platform.foundation.governance.repository_boundary.cli:main"

[tool.setuptools.packages.find]
include = ["components*", "orchestration*", "noetrium*", "noetrium_platform*"]

[tool.setuptools.package-data]
"noetrium_platform.foundation.governance.system_registry" = ["catalog.json"]
"noetrium_platform.capabilities.environment.minecraft.providers" = ["assets/mineflayer_bridge/*.js", "assets/mineflayer_bridge/package.json", "assets/mineflayer_bridge/package-lock.json"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
